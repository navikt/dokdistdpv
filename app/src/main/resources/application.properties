server.shutdown=graceful
spring.main.banner_mode=off
spring.threads.virtual.enabled=true
# actuators
management.endpoints.web.exposure.include=prometheus,health
# actuator - health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.health.diskspace.enabled=false
management.endpoint.health.group.liveness.include=jms
# actuator - metrics
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.enable.http.client.requests=false

# codec max-in-memory-size
spring.http.codecs.max-in-memory-size=10MB

# Kan overstyres i env med DOKDISTDPV_QDIST016_ALTINN3_VEDLEGG_ZIP_GRENSE=n
dokdistdpv.qdist016.altinn3-vedlegg-zip-grense=10