kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{ APP_NAME }}
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  env:
    - name: APPD_NAME
      value: {{ APPD_NAME }}
    - name: DOKDISTDPV_JMS_BROKER_HOSTNAME
      value: {{ DOKDISTDPV_JMS_BROKER_HOSTNAME }}
    - name: DOKDISTDPV_JMS_BROKER_NAME
      value: {{ DOKDISTDPV_JMS_BROKER_NAME }}
    - name: DOKDISTDPV_JMS_BROKER_PORT
      value: "{{ DOKDISTDPV_JMS_BROKER_PORT }}"
    - name: DOKDISTDPV_JMS_BROKER_CHANNEL
      value: {{ DOKDISTDPV_JMS_BROKER_CHANNEL }}
    - name: DOKDISTDPV_JMS_QUEUES_QDIST016
      value: {{ DOKDISTDPV_JMS_QUEUES_QDIST016 }}
    - name: DOKDISTDPV_JMS_QUEUES_QDIST016_FUNKSJONELL_FEIL
      value: {{ DOKDISTDPV_JMS_QUEUES_QDIST016_FUNKSJONELL_FEIL }}
    - name: DOKDISTDPV_JMS_QUEUES_QDIST017
      value: {{ DOKDISTDPV_JMS_QUEUES_QDIST017 }}
    - name: DOKDISTDPV_JMS_QUEUES_QDIST017_FUNKSJONELL_FEIL
      value: {{ DOKDISTDPV_JMS_QUEUES_QDIST017_FUNKSJONELL_FEIL }}
    - name: DOKDISTDPV_JMS_QUEUES_QDIST009
      value: {{ DOKDISTDPV_JMS_QUEUES_QDIST009 }}
    - name: DOKDISTMELLOMLAGER_PROJECTID
      value: {{ DOKDISTMELLOMLAGER_PROJECTID }}
    - name: DOKDISTMELLOMLAGER_BUCKET
      value: {{ DOKDISTMELLOMLAGER_BUCKET }}
    - name: DOKDISTMELLOMLAGER_KEYRING
      value: {{ DOKDISTMELLOMLAGER_KEYRING }}
    - name: DOKDISTMELLOMLAGER_KEYID
      value: {{ DOKDISTMELLOMLAGER_KEYID }}
    - name: ALTINN_INSERT_CORRESPONDENCE_SERVICE_ENDPOINT
      value: {{ ALTINN_INSERT_CORRESPONDENCE_SERVICE_ENDPOINT }}
    - name: ALTINN_EXTERNAL_SERVICE_CODE
      value: {{ ALTINN_EXTERNAL_SERVICE_CODE }}
    - name: ALTINN_EXTERNAL_SERVICE_EDITION_CODE
      value: {{ ALTINN_EXTERNAL_SERVICE_EDITION_CODE }}
  image: {{ image }}
  ingresses:
    {{#each INGRESSES}}
       - {{ this }}
      {{/each}}
  liveness:
    path: /isAlive
    port: 8080
    initialDelay: 30
    failureThreshold: 10
  port: 8080
  webproxy: true
  prometheus:
    enabled: true
    path: /actuator/prometheus
  readiness:
    path: /isReady
    port: 8080
    initialDelay: 30
    timeout: 3
  replicas:
    min: {{ MIN_REPLICAS }}
    max: {{ MAX_REPLICAS }}
    cpuThresholdPercentage: 50
  resources:
    limits:
      cpu: 3000m
      memory: 1536Mi
    requests:
      cpu: 60m
      memory: 1024Mi
  vault:
    enabled: true
    paths:
      - kvPath: {{ SERVICE_USER }}
        mountPath: "/secrets/serviceuser/srvdokdistdpv"
      - kvPath: {{ DOKDISTDPV_VAULT }}
        mountPath: "/var/run/secrets/nais.io/vault"
      - kvPath: {{ VIRKSOMHETSSERTIFIKAT_VAULT }}
        mountPath: "/secrets/virksomhetssertifikat"
      - kvPath: {{ APPDYNAMICS }}
        mountPath: /var/run/secrets/nais.io/appdynamics
  azure:
    application:
      enabled: true