name: Manual deploy to dev

on:
  workflow_dispatch:
    inputs:
      q1:
        type: boolean
        description: Deploy til q1
        required: false
      q2:
        type: boolean
        description: Deploy til q2
        required: false

jobs:

  deploy-q1:
    uses: navikt/dok-workflows/.github/workflows/deploy-dev.yaml@main
    with:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      NAIS_VARIABLES: nais/${{inputs.namespace}}-config.json
    secrets: inherit
