name: Deploy release to prod

on:
  release:
    types:
      - published

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  deploy-prod:
    uses: navikt/dok-workflows/.github/workflows/deploy-prod.yaml@main
    with:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      NAIS_VARIABLES: nais/p-config.json
    secrets: inherit
