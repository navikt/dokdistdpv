name: Deploy release to prod

on:
  release:
    types:
      - published

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build:
    uses: navikt/dok-workflows/.github/workflows/build.yaml@main
    with:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    secrets: inherit

#  deploy-q1:
#    uses: navikt/dok-workflows/.github/workflows/deploy.yaml@main
#    needs: build
#    with:
#      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
#      NAIS_RESOURCE: nais/naiserator.yaml
#      NAIS_VARIABLES: nais/q1-config.json
#    secrets: inherit

  deploy-prod:
    name: Deploy to NAIS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-fss
          RESOURCE: nais/naiserator.yaml
          VARS: nais/p-config.json
